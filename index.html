{t:'Understanding market trends',l:'Intermediate',p:'Markets move in uptrends (higher highs and higher lows), downtrends (lower highs and lower lows) or ranges (sideways). Knowing which one you are in shapes every decision.',k:['Trend lines and moving averages (for example the 50 and 200) help you see direction','Interest rate decisions, inflation, jobs data and central bank speeches move currencies','Big news causes sudden spikes: many traders avoid trading right before it','A trend is a probability, never a guarantee']},
{t:'Buying and selling currency pairs',l:'Intermediate',p:'Buying (going long) a pair means you expect the base currency to strengthen. Selling (going short) means you expect it to weaken. You profit from the move in the right direction.',k:['Market orders execute now; limit and stop orders execute at a price you choose','A stop loss closes a losing trade at a level you set; take profit locks in a gain','Leverage lets you control a large position with a small deposit, and it magnifies losses as well as gains','Practise every step on a demo account first']},
{t:'Risk management',l:'Essential',p:'Risk management is what keeps you in the game. Professionals focus first on how much they can lose, then on how much they can win.',k:['Many traders risk only 1% to 2% of the account on a single trade','Always place a stop loss and know your risk-to-reward ratio before entering','Avoid over-leverage and never trade money you cannot afford to lose','Keep a trading journal and set a daily loss limit']},
{t:'Trading strategies',l:'Advanced',p:'A strategy is a written set of rules for when to enter, exit and how much to risk. Common approaches include trend following, breakout trading, range trading, swing trading and news trading.',k:['Test every strategy on a demo account or with historical data before using real money','Consistency beats complexity: follow your rules every time','Be careful with signal sellers who promise guaranteed profits: no one can guarantee returns','Review your results monthly and improve one thing at a time']},
{t:'Learning paths: beginner to advanced',l:'All levels',p:'Beginners start with the basics, a demo account and one currency pair. Intermediate learners add price action, indicators and trading psychology. Advanced learners work on multi-timeframe analysis, position sizing and portfolio-level risk.',k:['Beginner: terms, platform, demo trading, a simple written plan','Intermediate: price action, support and resistance, indicators, journaling','Advanced: multi-timeframe analysis, correlation, risk models, performance review','Personal coaching is available: message us on WhatsApp']}];

{t:'Understanding blockchain technology',l:'Beginner',p:'A blockchain is a shared digital ledger. Transactions are grouped into blocks and linked together using cryptography, and thousands of computers keep identical copies, so no single party controls it.',k:['Bitcoin (2009) was the first major blockchain currency','Ethereum added smart contracts: programs that run on the blockchain','Records are very hard to change once confirmed','Networks agree on new blocks through systems such as proof of work and proof of stake']},
{t:'Creating and securing a wallet',l:'Beginner',p:'A wallet stores the keys that control your coins. Custodial wallets (on an exchange) are managed for you. Non-custodial wallets are controlled only by you, which gives freedom and responsibility.',k:['Your seed phrase (12 or 24 words) is the master key: write it on paper, store it offline, never photograph or share it','Use a strong, unique password and a hardware wallet for larger amounts','Send a small test amount before moving a large one','Anyone who asks for your seed phrase is a scammer']},
{t:'How to buy Bitcoin and other coins',l:'Beginner',p:'Buy only through regulated or well-established providers. You normally verify your identity, fund your account by bank transfer or card, then place an order.',k:['Compare fees and the spread (buy price against sell price)','Market orders buy now at the current price; limit orders buy at your chosen price','Withdraw to your own wallet if you plan to hold for the long term','Keep records of every purchase']},
{t:'How to sell cryptocurrency',l:'Beginner',p:'Selling means exchanging your coins for local currency. Confirm the rate and fees before you send anything, and only send to an address you have verified from a trusted source.',k:['Use licensed providers or businesses with a clear, documented process','Double-check the wallet address and the network (for example TRC20 or ERC20) before sending','Blockchain transfers cannot be reversed','Keep transaction records for tax and compliance']},
{t:'How cryptocurrency exchanges work',l:'Intermediate',p:'An exchange matches buyers and sellers using an order book: a list of buy offers (bids) and sell offers (asks). Liquidity is how easily you can trade without moving the price.',k:['Centralised exchanges hold your coins for you; decentralised exchanges let you trade from your own wallet','Makers add orders to the book; takers fill existing orders. Fees often differ','Do not keep large amounts on an exchange for long periods','Check that the provider is regulated in your country']},
{t:'How to transfer digital assets',l:'Intermediate',p:'To send coins you need the receiver address and the correct network. Sending on the wrong network can lose funds permanently.',k:['USDT exists on several networks (such as TRC20 and ERC20): the sender and receiver must match','Network fees change with demand; confirmations take from seconds to minutes','Some coins need a memo or tag (for example XRP)','Always send a small test transaction first']},
{t:'How to identify cryptocurrency scams',l:'Essential',p:'Most scams copy the same patterns. Slow down whenever someone creates urgency or promises easy money.',k:['Guaranteed returns, double-your-money offers and fake giveaways are red flags','Fake support agents, phishing links and look-alike websites steal logins','Pump-and-dump groups and rug pulls trap late buyers','Never share OTP codes, passwords or your seed phrase with anyone']},
{t:'How to protect your digital assets',l:'Essential',p:'Security is a set of habits. A few simple steps stop most attacks.',k:['Turn on two-factor authentication with an authenticator app, not only SMS','Use a password manager and a different password for every account','Whitelist withdrawal addresses and enable anti-phishing codes where offered','Keep devices updated, avoid public Wi-Fi for transactions and plan for emergencies (who can access your assets if something happens to you)']}];

  if(AD.tab==='enq')b='<div id="en-l"><p class="mu">Loading...</p></div>';
  if(AD.tab==='nt')b=`<div class="glass pad"><label>Send to</label><select id="nt-s"><option value="all">All customers</option><option value="user">One customer</option></select><div id="nt-tw"></div><label>Title</label><input id="nt-ti"><label>Message</label><textarea id="nt-b"></textarea><button class="btn" style="margin-top:1rem" data-act="sendn">Send</button></div>`;
  if(AD.tab==='set'){const g=ADM.cfg,f=(k,l,ph)=>`<label>${l}</label><input id="st-${k}" value="${esc(g[k]||'')}" placeholder="${ph||''}">`;b=`<div class="glass pad">${f('brand','Brand name')}${f('tagline','Tagline')}${f('whatsapp','WhatsApp number with country code, digits only','2348012345678')}<div class="two"><div>${f('phone','Phone')}</div><div>${f('email','Email')}</div></div>${f('address','Address')}${f('hours','Opening hours')}<label>About us text</label><textarea id="st-about">${esc(g.about||'')}</textarea>${f('reg_info','Registration and licence details (shown in the footer and About page)')}<h3 style="margin-top:1rem">Social handles</h3><p class="mu">Type @yourname or paste the full link.</p><div class="two"><div>${f('instagram','Instagram')}</div><div>${f('x','X (Twitter)')}</div><div>${f('snapchat','Snapchat')}</div><div>${f('tiktok','TikTok')}</div></div><h3 style="margin-top:1rem">Controls</h3><label>Crypto buy and sell requests</label><select id="st-crypto_trading"><option value="off" ${g.crypto_trading!=='on'?'selected':''}>OFF (until approvals are in place)</option><option value="on" ${g.crypto_trading==='on'?'selected':''}>ON</option></select><label>Gift card requests</label><select id="st-giftcards"><option value="on" ${g.giftcards!=='off'?'selected':''}>ON</option><option value="off" ${g.giftcards==='off'?'selected':''}>Paused</option></select>${f('high_value','Flag requests worth at least (naira)','1000000')}<button class="btn" style="margin-top:1rem" data-act="savecfg">Save settings</button></div>`}
  view(`<section class="sec"><span class="eyebrow">Admin</span><h1 style="font-size:clamp(1.6rem,5vw,2.4rem)">Control panel</h1><div class="tabs">${T.map(t=>`<button class="${AD.tab===t[0]?'on':''}" data-act="adtab" data-t="${t[0]}">${t[1]}</button>`).join('')}<button data-act="adout">Lock</button></div>${b}</section>`);
  if(AD.tab==='req')adReq();if(AD.tab==='enq')adEnq();if(AD.tab==='nt')ntW()}
 catch(e){if(/sign in again|allowed/i.test(e.message)){ATOK='';sessionStorage.removeItem('fx_a');pAdmin()}else view('<div class="note r">'+esc(e.message)+'</div>')}}
const rateForm=r=>`<div data-rate="${esc(r.id||'')}"><div class="two"><div><label>Brand</label><select class="rb">${BR.map(x=>`<option ${r.brand===x[0]?'selected':''}>${esc(x[0])}</option>`).join('')}</select></div><div><label>Card type</label><select class="rt"><option ${r.cardtype==='Physical'?'selected':''}>Physical</option><option ${r.cardtype==='E-code'?'selected':''}>E-code</option></select></div><div><label>Country</label><input class="rc" value="${esc(r.country||'')}"></div><div><label>Currency (3 letters)</label><input class="rcu" maxlength="3" value="${esc(r.currency||'')}"></div><div><label>Min value</label><input class="rmin" type="number" value="${r.min||0}"></div><div><label>Max value</label><input class="rmax" type="number" value="${r.max||0}"></div><div><label>Rate (NGN per 1 unit)</label><input class="rr" type="number" step="any" value="${r.rate||0}"></div><div><label>Note</label><input class="rn" value="${esc(r.note||'')}"></div></div><div class="chk"><input type="checkbox" class="ra" ${r.active!==false?'checked':''}><span>Active</span></div><div class="cta"><button class="btn sm" data-act="saverate">${r.id?'Save':'Add rate'}</button>${r.id?'<button class="btn sm dg" data-act="delrate">Delete</button>':''}</div></div>`;
async function adReq(){try{const r=await api('adminRequests',{},ATOK),f=AD.filter;let L=r.items;if(f==='__flag')L=L.filter(x=>x.flag);else if(f)L=L.filter(x=>x.status===f);
 $('#rq-l').innerHTML=L.map(x=>`<details data-ref="${esc(x.ref)}"><summary><span>${esc(x.ref)} &middot; ${esc(x.customer)} ${x.flag?'<span class="badge b-r">'+esc(x.flag)+'</span>':''}</span><span>${stBadge(x.status)}</span></summary><div class="bd"><p>${x.type==='Gift card'?`${esc(x.brand)} &middot; ${esc(x.country)} &middot; ${x.amount} ${esc(x.currency)} &middot; ${esc(x.cardtype)} &middot; ${esc(x.source)}<br>Estimate: ${x.est?naira(Number(x.est)):'rate on request'}`:`${esc(x.side)} ${x.amount} ${esc(x.unit)} ${esc(x.coin)} &middot; ${esc(x.network||'')}<br>Wallet: ${esc(x.wallet||'-')}<br>${esc(x.indicative||'')}`}<br>Payout: ${esc(x.bank||'-')} ${esc(x.acctno||'')} ${esc(x.acctname||'')}<br>Phone: ${esc(x.phone)}</p><div class="two"><div><label>Status</label><select class="qs">${ADM.statuses.map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Payment</label><select class="qp">${['Unpaid','Processing','Paid'].map(s=>`<option ${x.pay===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Final quote (shown to customer)</label><input class="qq" value="${esc(x.quote||'')}"></div><div><label>Flag (clear to remove)</label><input class="qf" value="${esc(x.flag||'')}"></div></div><label>Note to customer</label><textarea class="qn">${esc(x.note||'')}</textarea><button class="btn sm" style="margin-top:.6rem" data-act="savereq">Save and notify</button></div></details>`).join('')||'<p class="mu">Nothing here.</p>'}catch(e){toast(e.message)}}
async function adEnq(){try{const r=await api('adminEnquiries',{},ATOK);$('#en-l').innerHTML=r.items.map(e=>`<div class="glass pad" style="margin:.6rem 0" data-en="${esc(e.id)}"><b>${esc(e.topic)}</b> <span class="badge ${e.status==='Answered'?'b-ok':'b-w'}">${esc(e.status)}</span><div class="mu">${esc(e.name)} &middot; ${esc(e.email)} &middot; ${esc(e.phone)} &middot; ${fmt(e.created)}</div><p>${esc(e.message)}</p>${e.reply?`<div class="note"><b>Reply:</b> ${esc(e.reply)}</div>`:`<textarea class="er" placeholder="Write a reply"></textarea><button class="btn sm" style="margin-top:.5rem" data-act="reply">Send reply</button>`}</div>`).join('')||'<p class="mu">No enquiries yet.</p>'}catch(e){toast(e.message)}}
const ntW=()=>{const s=$('#nt-s'),w=$('#nt-tw'),f=()=>{w.innerHTML=s.value==='user'?'<label>Customer email or ID</label><input id="nt-t">':''};s.onchange=f;f()};
/* ---------------- actions ---------------- */
const v=id=>($('#'+id)||{}).value||'';
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 try{
 if(a==='menu'){$('#drawer').classList.add('on');return}if(a==='menuclose'){if(e.target.closest('#dnav a')||e.target.id==='drawer')$('#drawer').classList.remove('on');return}
 if(a==='theme'){const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;localStorage.setItem('fx_th',t);chrome();return}
 if(a==='logout'){TOK='';localStorage.removeItem('fx_t');ME=null;UNREAD=0;$('#drawer').classList.remove('on');chrome();return}
 if(a==='mdx'){$('#md').classList.remove('on');return}
 if(a==='register'){b.disabled=true;try{await api('signup',{site:location.href.split('#')[0],name:v('rg-n'),email:v('rg-e'),phone:v('rg-p'),country:v('rg-c'),password:v('rg-pw'),agree:$('#rg-a').checked},'');view(`<section class="sec" style="text-align:center">${secH('Almost there','Check your email','We sent a verification link. Open it to activate your account, then log in.')}<a class="btn" href="#/login">Go to log in</a></section>`)}catch(x){toast(x.message);b.disabled=false}return}
 if(a==='login'){b.disabled=true;try{const r=await api('login',{email:v('li-e'),password:v('li-p')},'');TOK=r.token;localStorage.setItem('fx_t',TOK);ME=r.me;DB.tab='over';location.hash='#/dashboard'}catch(x){toast(x.message);b.disabled=false}return}
 if(a==='resend'){await api('resend',{email:v('li-e'),site:location.href.split('#')[0]},'');toast('If that account needs verification, a new email has been sent.');return}
 if(a==='side'){TR.side=b.dataset.s;$$('[data-act=side]').forEach(x=>x.classList.toggle('on',x===b));$('#tr-buy').hidden=TR.side!=='buy';$('#tr-sell').hidden=TR.side!=='sell';$('#tr-net').hidden=TR.side!=='buy';if(TR.ind_)TR.ind_();return}
 if(a==='trade'){b.disabled=true;try{const r=await api('submitCrypto',{item:{side:TR.side,coin:v('tr-c'),amount:v('tr-a'),unit:v('tr-u'),network:v('tr-n'),wallet:v('tr-w'),bank:v('tr-b'),acctno:v('tr-an'),acctname:v('tr-ac'),indicative:TR.ind||'',agree:$('#tr-ag').checked}});done(r.ref,'Your crypto request')}catch(x){toast(x.message);b.disabled=false}return}
 if(a==='gift'){b.disabled=true;try{const r=await api('submitGift',{item:{brand:v('gq-b'),country:v('gq-c'),currency:v('gq-cur'),amount:v('gq-a'),cardtype:v('gq-t'),source:v('gq-s'),bank:v('gq-bank'),acctno:v('gq-an'),acctname:v('gq-ac'),owns:$('#gq-o').checked,lawful:$('#gq-l').checked}});done(r.ref,'Your gift card request')}catch(x){toast(x.message);b.disabled=false}return}
 if(a==='track'){b.disabled=true;try{const r=(await api('track',{ref:v('tk-r'),email:v('tk-e')},'')).item;$('#tk-out').innerHTML=`<div class="glass pad" style="max-width:520px;margin-top:1rem"><h3>${esc(r.ref)}</h3><p class="mu">${esc(r.type)} &middot; ${fmt(r.created)}</p><p>${stBadge(r.status)} ${payBadge(r.pay)}</p>${r.quote?`<p>Final quote: <b>${esc(r.quote)}</b></p>`:''}${r.note?`<div class="note">${esc(r.note)}</div>`:''}${timeline(r.history)}${waBtn('Ask about this transaction','Hello, I have a question about transaction '+r.ref+'.')}</div>`}catch(x){toast(x.message)}b.disabled=false;return}
 if(a==='enq'){b.disabled=true;try{await api('enquiry',{name:v('ct-n'),email:v('ct-e'),phone:v('ct-p'),topic:v('ct-t'),message:v('ct-m')});toast('Message sent. We will reply by email.');$('#ct-m').value=''}catch(x){toast(x.message)}b.disabled=false;return}
 if(a==='dtab'){DB.tab=b.dataset.t;pDash();return}
 if(a==='txd'){const r=DB.rq.find(x=>x.ref===b.dataset.ref);$('#mdin').innerHTML=txModal(r);$('#md').classList.add('on');return}
 if(a==='supsend'){await api('enquiry',{name:ME.name,email:ME.email,phone:ME.phone,topic:v('sp-t'),message:v('sp-m')});toast('Sent to support');DB.tab='sup';pDash();return}
 if(a==='adlogin'){const r=await api('adminLogin',{password:v('ad-p')},'');ATOK=r.token;sessionStorage.setItem('fx_a',ATOK);ADM=null;pAdmin();return}
 if(a==='adout'){ATOK='';sessionStorage.removeItem('fx_a');ADM=null;pAdmin();return}
 if(a==='adtab'){AD.tab=b.dataset.t;pAdmin();return}
 if(a==='savereq'){const c=b.closest('[data-ref]'),q=s=>c.querySelector(s);await api('updateRequest',{ref:c.dataset.ref,status:q('.qs').value,pay:q('.qp').value,quote:q('.qq').value,flag:q('.qf').value,note:q('.qn').value},ATOK);toast('Saved. Customer notified.');AD.reload=true;adReq();return}
 if(a==='saverate'||a==='delrate'){const c=b.closest('[data-rate]'),q=s=>c.querySelector(s);if(a==='delrate'){if(!confirm('Delete this rate?'))return;await api('deleteRate',{id:c.dataset.rate},ATOK)}else await api('saveRate',{item:{id:c.dataset.rate,brand:q('.rb').value,cardtype:q('.rt').value,country:q('.rc').value,currency:q('.rcu').value,min:q('.rmin').value,max:q('.rmax').value,rate:q('.rr').value,note:q('.rn').value,active:q('.ra').checked}},ATOK);toast('Done');AD.reload=true;await boot(true);pAdmin();return}
 if(a==='savecoin'){const c=b.closest('[data-coin]');await api('saveCoin',{item:{sym:c.dataset.coin,buy:c.querySelector('.cb').value,sell:c.querySelector('.cs').value,active:c.querySelector('.ca').checked}},ATOK);toast('Saved');AD.reload=true;await boot(true);return}
 if(a==='saveu'){const c=b.closest('[data-u]');await api('saveUser',{item:{id:c.dataset.u,status:c.querySelector('.us').value,verified:!!(c.querySelector('.uv')&&c.querySelector('.uv').checked)}},ATOK);toast('Saved');AD.reload=true;pAdmin();return}
 if(a==='reply'){const c=b.closest('[data-en]');await api('replyEnquiry',{id:c.dataset.en,reply:c.querySelector('.er').value},ATOK);toast('Reply sent');adEnq();return}
 if(a==='sendn'){await api('sendNotif',{scope:v('nt-s'),target:v('nt-t'),title:v('nt-ti'),body:v('nt-b')},ATOK);toast('Notification sent');$('#nt-ti').value='';$('#nt-b').value='';return}
 if(a==='savecfg'){const k=['brand','tagline','whatsapp','phone','email','address','hours','about','reg_info','instagram','x','snapchat','tiktok','crypto_trading','giftcards','high_value'],o={};k.forEach(x=>o[x]=v('st-'+x));await api('saveConfig',{cfg:o},ATOK);toast('Settings saved');AD.reload=true;await boot(true);pAdmin();return}
 }catch(x){toast(x.message);if(b)b.disabled=false}});
document.addEventListener('change',e=>{if(e.target.id==='rq-f'){AD.filter=e.target.value;adReq()}if(e.target.id==='rt-fb'){AD.rb=e.target.value;pAdmin()}});
function done(ref,what){view(`<section class="sec" style="text-align:center;max-width:560px;margin:0 auto">${secH('Submitted',what+' is in','Keep your reference number.')}<div class="glass pad"><span class="mu">Reference</span><h2 class="grad">${esc(ref)}</h2><p class="mu">We will review it and update the status in your dashboard. You will also get a notification.</p><div class="cta" style="justify-content:center"><a class="btn" href="#/dashboard">Open dashboard</a>${waBtn('Message us about it','Hello, I just submitted request '+ref+'.')}</div></div></section>`)}
$('#md').addEventListener('click',e=>{if(e.target.id==='md')$('#md').classList.remove('on')});
/* ---------------- router ---------------- */
function route(){chrome();const p=(location.hash||'#/').slice(1).split('/').filter(Boolean),k=p[0]||'';$('#drawer').classList.remove('on');
 const R={'':pHome,giftcards:pGift,rates:pRates,crypto:pCrypto,trade:pTrade,forex:pForex,cryptoacademy:pCA,track:pTrack,about:pAbout,contact:pContact,whatsapp:pWa,connect:pConnect,login:()=>pLogin(),register:pRegister,quote:pQuote,dashboard:pDash,terms:pTerms,admin:pAdmin};
 if(k==='verify')return pVerify(p[1]);(R[k]||pHome)()}
async function boot(q){try{const r=await api('init',{},'');S.cfg=r.cfg;S.rates=r.rates;S.coins=r.coins}catch(e){S.cfg=S.cfg||{}}
 if(q){chrome();return}route();ticker();setInterval(ticker,60000);
 if(TOK){api('notifs').then(r=>{UNREAD=r.unread;chrome()}).catch(()=>{})}}
addEventListener('hashchange',route);
boot();
})();
